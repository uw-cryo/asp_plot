# pixi manifest for reproducible development environments (issue #184).
#
# This is an alternative to `conda env create -f environment.yml`; both are
# supported and produce an equivalent environment. What pixi adds is
# `pixi.lock`, which pins every resolved package (conda and pypi, per
# platform) so that environments cannot drift between contributors, between
# machines, or between a contributor and CI.
#
# Package metadata -- version, runtime dependencies, entry points -- still
# lives in pyproject.toml. This file describes only the *development*
# environment, and installs the package itself in editable mode.
#
# Quick start (https://pixi.sh/latest/#installation):
#   pixi run setup    # install the pre-commit hooks
#   pixi run test     # run the test suite
#   pixi shell        # drop into the environment interactively

[workspace]
name = "asp_plot"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

# Runtime dependencies, resolved as conda packages rather than wheels so that
# GDAL and friends come from conda-forge. Keep this list in sync with
# `[project] dependencies` in pyproject.toml and with the `run:` section of
# conda-forge-recipe/meta.yaml.
[dependencies]
python = ">=3.11"
click = "*"
contextily = "*"
fpdf2 = "*"
gdal = "*"
geopandas = "*"
matplotlib-base = "*"
matplotlib-scalebar = "*"
numpy = "*"
pandas = "*"
pyproj = "*"
rasterio = "*"
rioxarray = "*"
scipy = "*"
shapely = "*"
pyyaml = "*"
sliderule = ">=5.3.0"
xarray = "*"

# The package itself, editable, so `asp_report` and the other CLIs run against
# the working tree. pixi resolves its declared dependencies against the conda
# packages above instead of downloading wheels for them.
[pypi-dependencies]
asp_plot = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
pre-commit = "*"

# Mirrors `[project.optional-dependencies] docs` in pyproject.toml. The pins
# match docs/requirements.txt, which is what ReadTheDocs installs; see the
# comment there for why sphinx-book-theme is held below 1.3.
[feature.docs.dependencies]
sphinx = ">=7"
myst-nb = "*"
sphinx-autoapi = "*"
sphinx-design = "*"
sphinx-copybutton = "*"
sphinx-book-theme = ">=1.1,<1.3"
sphinx-autobuild = "*"

[environments]
default = { features = ["dev", "docs"] }

[tasks]
setup = { cmd = "pre-commit install", description = "Install the pre-commit hooks (required for development)" }
test = { cmd = "pytest", description = "Run the test suite" }
lint = { cmd = "pre-commit run --all-files", description = "Run black, flake8, and isort over the whole repo" }

# Sphinx reads notebooks, figures, and reports from inside docs/, so they are
# copied in first. ReadTheDocs does the same in its `pre_build` job.
docs-assets = { cmd = """
    mkdir -p docs/examples/notebooks docs/_extra/examples/figures docs/_static/reports &&
    cp notebooks/*/*.ipynb docs/examples/notebooks/ &&
    cp notebooks/figures/* docs/_extra/examples/figures/ &&
    cp reports/*.pdf docs/_static/reports/
    """, description = "Stage notebooks, figures, and reports into docs/" }
docs = { cmd = "sphinx-autobuild docs docs/_build/html --open-browser", depends-on = [
    "docs-assets",
], description = "Serve the docs locally with live reload" }
docs-build = { cmd = "sphinx-build -b html docs docs/_build/html", depends-on = [
    "docs-assets",
], description = "Build the docs once into docs/_build/html" }
