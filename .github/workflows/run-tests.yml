# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    # Login shell so the conda env activated by setup-miniconda is on PATH
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v4
    # Install Miniforge rather than relying on a conda bundled with the
    # runner image: ubuntu-26.04 ships none, so $CONDA is empty there.
    - name: Set up conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        environment-file: environment.yml
        activate-environment: asp_plot
        conda-remove-defaults: "true"
    - name: Test with pytest
      run: pytest
